apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: p5, labels: {app: api}}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      enableServiceLinks: false  # else k8s injects DB_PORT=tcp://... etc.
      containers:
        - name: api
          image: p5-api:m07
          imagePullPolicy: Never
          env:
            - {name: DB_HOST, value: db}
            - {name: CACHE_HOST, value: cache}
            - {name: CACHE_TTL_S, value: "60"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: p5}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]