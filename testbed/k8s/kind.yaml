# Single-node kind cluster for the M07 testbed. Web's NodePort 30080 is mapped to
# localhost:30080 so load reaches the web pod through its eth0 (D-035).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP